name: IPQ807X-25.12-NSS-Dual

on:
  workflow_dispatch:
  workflow_call:

env:
  REPO_URL: https://github.com/laipeng668/openwrt-6.x.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: configs/IPQ807X.config
  GENERAL_CONFIG_FILE: configs/General.config
  DIY_SCRIPT: scripts/Jacob-script.sh
  FIRMWARE_TAG: IPQ807X-25.12-NSS
  CUSTOM_LAN_IP: 192.168.20.1
  CUSTOM_HOSTNAME: JacobWrt
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Init
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl jq ccache
          curl -fsSL ophub.org/ubuntu2404-make-openwrt-depends >/tmp/deps
          sudo apt-get install -y $(cat /tmp/deps)
          sudo timedatectl set-timezone "$TZ"
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Clone
        run: |
          set -Eeuo pipefail
          sudo rm -rf /mnt/openwrt
          sudo mkdir -p /mnt/openwrt
          sudo chown $USER:$USER /mnt/openwrt
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" /mnt/openwrt
          cd /mnt/openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          echo "SOURCE_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "SOURCE_SHORT_HASH=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV

      - name: Feeds
        run: |
          cd $OPENWRT_PATH
          grep -q nikki feeds.conf.default || echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Customize
        run: |
          set -Eeuo pipefail
          chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT"
          cd $OPENWRT_PATH
          CUSTOM_LAN_IP=$CUSTOM_LAN_IP CUSTOM_HOSTNAME=$CUSTOM_HOSTNAME "$GITHUB_WORKSPACE/$DIY_SCRIPT"

      - name: Config
        run: |
          set -Eeuo pipefail
          cd $OPENWRT_PATH
          cat "$GITHUB_WORKSPACE/$CONFIG_FILE" "$GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE" > .config

          add() {
            sed -i "/^$1=/d" .config
            echo "$1=y" >> .config
          }

          add CONFIG_TARGET_qualcommax
          add CONFIG_TARGET_qualcommax_ipq807x

          add CONFIG_PACKAGE_kmod-qca-nss-dp
          add CONFIG_PACKAGE_kmod-qca-nss-drv
          add CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe
          add CONFIG_PACKAGE_kmod-qca-nss-ecm

          add CONFIG_PACKAGE_kmod-dummy
          add CONFIG_PACKAGE_kmod-tun
          add CONFIG_PACKAGE_nikki
          add CONFIG_PACKAGE_luci-app-nikki

          add CONFIG_PACKAGE_kmod-mhi-net
          add CONFIG_PACKAGE_kmod-mhi-pci-generic
          add CONFIG_PACKAGE_kmod-usb-net-qmi-wwan
          add CONFIG_PACKAGE_kmod-usb-net-cdc-mbim
          add CONFIG_PACKAGE_modemmanager

          make defconfig

      - name: Compile
        id: compile
        run: |
          set -Eeuo pipefail
          cd $OPENWRT_PATH
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "BUILD_ID=$(date +%Y%m%d-%H%M%S)-${SOURCE_SHORT_HASH}" >> $GITHUB_ENV

      - name: Release Files
        if: steps.compile.outputs.status == 'success'
        run: |
          set -Eeuo pipefail
          TARGET="$OPENWRT_PATH/bin/targets/qualcommax/ipq807x"
          OUT="$OPENWRT_PATH/release-files"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -d "$TARGET" || { echo "ERROR: Missing target output: $TARGET"; exit 1; }

          count=0
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            case "$base" in
              *fg2000*|*FG2000*|*inseego*|*ap8220*|*AP8220*|*aliyun*)
                cp "$file" "$OUT/${BUILD_ID}-${base}"
                count=$((count + 1))
                ;;
            esac
          done < <(find "$TARGET" -maxdepth 1 -type f -print0)

          cp "$OPENWRT_PATH/.config" "$OUT/${BUILD_ID}-config"
          [ -f "$TARGET/config.buildinfo" ] && cp "$TARGET/config.buildinfo" "$OUT/${BUILD_ID}-config.buildinfo" || true
          [ -f "$TARGET/sha256sums" ] && cp "$TARGET/sha256sums" "$OUT/${BUILD_ID}-sha256sums" || true

          echo "Collected firmware files: $count"
          ls -lh "$OUT"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No FG2000/AP8220 firmware images found."
            echo "Available target files:"
            find "$TARGET" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

      - name: Upload Release
        if: steps.compile.outputs.status == 'success'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.FIRMWARE_TAG }}
          name: IPQ807X 25.12 NSS Rolling
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false
          removeArtifacts: false
          artifacts: /mnt/openwrt/release-files/*
          artifactErrorsFailBuild: true
