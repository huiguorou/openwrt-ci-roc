name: XR1710G-Nikki

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "YYH2913/openwrt tag/branch/commit"
        required: true
        default: "260820"
        type: string
      publish_release:
        description: "Publish firmware to GitHub Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/YYH2913/openwrt.git
  NIKKI_FEED: https://github.com/nikkinikki-org/OpenWrt-nikki.git
  TZ: Asia/Shanghai
  CONFIG_FILE: configs/XR1710G-Nikki.config

jobs:
  build:
    name: Build XR1710G with Nikki
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl jq time ccache \
            libelf-dev dwarves patchutils subversion gettext-base \
            libpython3-dev python3-pyelftools
          sudo apt-get clean

      - name: Clone YYH2913 upstream
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout "${UPSTREAM_REPO}" openwrt
          cd openwrt
          git fetch --depth=1 origin "${{ inputs.upstream_ref }}"
          git checkout --detach FETCH_HEAD

          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: Add Nikki feed
        shell: bash
        working-directory: openwrt
        run: |
          # Keep upstream feeds intact and append Nikki only.
          if ! grep -qE '^src-git[[:space:]]+nikki[[:space:]]' feeds.conf.default; then
            echo "src-git nikki ${NIKKI_FEED};main" >> feeds.conf.default
          fi
          tail -n 10 feeds.conf.default

      - name: Update and install feeds
        shell: bash
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply XR1710G + Nikki configuration
        shell: bash
        run: |
          test -f "${CONFIG_FILE}"
          cp "${CONFIG_FILE}" openwrt/.config
          cd openwrt
          make defconfig

          echo "===== Effective target ====="
          grep -E '^CONFIG_TARGET_airoha|gemtek_xr1710g' .config || true
          echo "===== Nikki / required kmods ====="
          grep -E '^CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-i18n-nikki-zh-cn|mihomo|kmod-dummy|kmod-tun)=' .config || true

      - name: Validate required packages
        shell: bash
        working-directory: openwrt
        run: |
          set -e
          required=(
            'CONFIG_TARGET_airoha=y'
            'CONFIG_TARGET_airoha_an7581=y'
            'CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi=y'
            'CONFIG_PACKAGE_nikki=y'
            'CONFIG_PACKAGE_luci-app-nikki=y'
            'CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y'
            'CONFIG_PACKAGE_kmod-dummy=y'
            'CONFIG_PACKAGE_kmod-tun=y'
          )
          for item in "${required[@]}"; do
            grep -Fxq "$item" .config || {
              echo "::error::Missing required config: $item"
              exit 1
            }
          done

          # Nikki currently depends on Mihomo and these networking modules.
          for pkg in \
            mihomo ca-bundle curl yq firewall4 ip-full \
            kmod-inet-diag kmod-nft-socket kmod-nft-tproxy; do
            grep -Eq "^CONFIG_PACKAGE_${pkg//-/-}=y$" .config || {
              echo "::warning::Dependency $pkg is not explicitly =y; checking package dependency resolution."
            }
          done

      - name: Download sources
        shell: bash
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware
        shell: bash
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect XR1710G firmware
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="openwrt/bin/targets/airoha/an7581"
          OUT="firmware"
          mkdir -p "${OUT}"

          test -d "${TARGET_DIR}"

          # Only collect the XR1710G outputs, not W1700K/EVB images.
          find "${TARGET_DIR}" -maxdepth 1 -type f \
            \( -name '*gemtek_xr1710g-ubi*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -print -exec cp -v {} "${OUT}/" \;

          SYSUPGRADE="$(find "${OUT}" -maxdepth 1 -type f -name '*gemtek_xr1710g-ubi*sysupgrade.itb' | head -n1)"
          test -n "${SYSUPGRADE}" && test -s "${SYSUPGRADE}"

          (
            cd "${OUT}"
            sha256sum * > SHA256SUMS-XR1710G-NIKKI.txt
          )

          {
            echo "upstream_repo=YYH2913/openwrt"
            echo "upstream_ref=${{ inputs.upstream_ref }}"
            echo "upstream_commit=${UPSTREAM_COMMIT}"
            echo "nikki_feed=nikkinikki-org/OpenWrt-nikki@main"
            echo "build_date=${BUILD_DATE}"
          } > "${OUT}/BUILD-INFO.txt"

          echo "===== Firmware files ====="
          ls -lh "${OUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XR1710G-Nikki-${{ env.BUILD_DATE }}-${{ env.UPSTREAM_SHORT }}
          path: firmware/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: XR1710G-Nikki-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: XR1710G Nikki | ${{ env.BUILD_DATE }} | ${{ env.UPSTREAM_SHORT }}
          generate_release_notes: false
          make_latest: true
          body: |
            Custom XR1710G firmware based directly on YYH2913/openwrt.

            - Upstream ref: `${{ inputs.upstream_ref }}`
            - Upstream commit: `${{ env.UPSTREAM_COMMIT }}`
            - Target: `airoha/an7581`
            - Device: `gemtek_xr1710g-ubi`
            - Nikki: included
            - kmod-dummy: included
            - kmod-tun: included

            IMPORTANT:
            The YYH2913 XR1710G 2.0 layout requires the matching XR1710G chainloader/U-Boot.
            Do not preserve configuration when crossing incompatible partition/layout revisions.
          files: firmware/*
