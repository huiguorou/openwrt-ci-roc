name: XR1710G-Nikki

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "YYH2913/openwrt tag/branch/commit"
        required: true
        default: "260820"
        type: string
      publish_release:
        description: "Publish firmware to GitHub Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/YYH2913/openwrt.git
  NIKKI_FEED: https://github.com/nikkinikki-org/OpenWrt-nikki.git
  TZ: Asia/Shanghai
  CONFIG_FILE: configs/XR1710G-Nikki.config

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl jq time ccache \
            libelf-dev dwarves patchutils subversion gettext-base \
            libpython3-dev python3-pyelftools
          sudo apt-get clean

      - name: Clone YYH2913 upstream
        run: |
          git clone --filter=blob:none --no-checkout "${UPSTREAM_REPO}" openwrt
          cd openwrt
          git fetch --depth=1 origin "${{ inputs.upstream_ref }}"
          git checkout --detach FETCH_HEAD
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: Add Nikki feed
        working-directory: openwrt
        run: |
          if ! grep -qE '^src-git[[:space:]]+nikki[[:space:]]' feeds.conf.default; then
            echo "src-git nikki ${NIKKI_FEED};main" >> feeds.conf.default
          fi
          tail -n 10 feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "===== Nikki feed layout ====="
          find feeds/nikki -maxdepth 3 -type d \
            \( -name nikki -o -name luci-app-nikki -o -name zh_Hans \) -print || true

      - name: Apply XR1710G and Nikki config
        run: |
          set -euo pipefail

          test -f "${CONFIG_FILE}"
          cp "${CONFIG_FILE}" openwrt/.config
          cd openwrt

          # YYH2913/OpenWrt has scripts/config as a directory, not a helper executable.
          # Set symbols directly in .config, then let make defconfig resolve dependencies.
          set_y() {
            local sym="$1"
            sed -i -e "/^CONFIG_${sym}=/d" -e "/^# CONFIG_${sym} is not set$/d" .config
            echo "CONFIG_${sym}=y" >> .config
          }

          set_y TARGET_airoha
          set_y TARGET_airoha_an7581
          set_y TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi

          set_y LUCI_LANG_zh_Hans

          set_y PACKAGE_nikki
          set_y PACKAGE_luci-app-nikki
          set_y PACKAGE_luci-i18n-nikki-zh-cn

          set_y PACKAGE_kmod-dummy
          set_y PACKAGE_kmod-tun
          set_y PACKAGE_kmod-inet-diag
          set_y PACKAGE_kmod-nft-socket
          set_y PACKAGE_kmod-nft-tproxy
          set_y PACKAGE_ca-bundle
          set_y PACKAGE_curl
          set_y PACKAGE_yq
          set_y PACKAGE_firewall4
          set_y PACKAGE_ip-full
          set_y PACKAGE_mihomo-meta

          make defconfig

          echo "===== Effective target ====="
          grep -E '^CONFIG_TARGET_airoha|gemtek_xr1710g' .config || true

          echo "===== LuCI language ====="
          grep -E '^CONFIG_LUCI_LANG_zh_Hans=' .config || true

          echo "===== Nikki / required dependencies ====="
          grep -E '^CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-i18n-nikki[^=]*|mihomo-meta|mihomo-alpha|kmod-dummy|kmod-tun|kmod-inet-diag|kmod-nft-socket|kmod-nft-tproxy)=' .config || true

      - name: Validate critical config
        working-directory: openwrt
        run: |
          set -euo pipefail

          required=(
            'CONFIG_TARGET_airoha=y'
            'CONFIG_TARGET_airoha_an7581=y'
            'CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi=y'
            'CONFIG_LUCI_LANG_zh_Hans=y'
            'CONFIG_PACKAGE_nikki=y'
            'CONFIG_PACKAGE_luci-app-nikki=y'
            'CONFIG_PACKAGE_kmod-dummy=y'
            'CONFIG_PACKAGE_kmod-tun=y'
            'CONFIG_PACKAGE_kmod-inet-diag=y'
            'CONFIG_PACKAGE_kmod-nft-socket=y'
            'CONFIG_PACKAGE_kmod-nft-tproxy=y'
            'CONFIG_PACKAGE_mihomo-meta=y'
          )

          for item in "${required[@]}"; do
            grep -Fxq "$item" .config || {
              echo "::error::Missing required config: $item"
              echo "===== related .config lines ====="
              grep -E 'NIKKI|nikki|mihomo|dummy|tun|LUCI_LANG|xr1710g|airoha' .config || true
              exit 1
            }
          done

          echo "===== Mihomo provider ====="
          if grep -Fxq 'CONFIG_PACKAGE_mihomo-meta=y' .config; then
            echo "mihomo-meta selected (recommended/default Nikki provider)"
          elif grep -Fxq 'CONFIG_PACKAGE_mihomo-alpha=y' .config; then
            echo "mihomo-alpha selected"
          else
            echo "::error::No concrete Mihomo provider selected"
            exit 1
          fi

          # Translation is useful but is not allowed to block the firmware build.
          # With current LuCI, zh_Hans maps to package suffix zh-cn.
          if grep -Fxq 'CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y' .config; then
            echo "Nikki Simplified Chinese translation: enabled"
          elif grep -Eq '^CONFIG_PACKAGE_luci-i18n-nikki-.*=y$' .config; then
            echo "::warning::Nikki translation is enabled under a different package symbol:"
            grep -E '^CONFIG_PACKAGE_luci-i18n-nikki-.*=y$' .config
          else
            echo "::warning::Nikki Simplified Chinese translation package was not selected."
            echo "::warning::Nikki itself and all required runtime kernel modules are enabled, so firmware build will continue."
          fi

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect XR1710G firmware
        run: |
          set -euo pipefail

          TARGET_DIR="openwrt/bin/targets/airoha/an7581"
          OUT="firmware"
          mkdir -p "${OUT}"
          test -d "${TARGET_DIR}"

          find "${TARGET_DIR}" -maxdepth 1 -type f \
            \( -name '*gemtek_xr1710g-ubi*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -print -exec cp -v {} "${OUT}/" \;

          SYSUPGRADE="$(find "${OUT}" -maxdepth 1 -type f -name '*gemtek_xr1710g-ubi*sysupgrade.itb' | head -n1)"
          test -n "${SYSUPGRADE}" && test -s "${SYSUPGRADE}"

          (
            cd "${OUT}"
            sha256sum * > SHA256SUMS-XR1710G-NIKKI.txt
          )

          {
            echo "upstream_repo=YYH2913/openwrt"
            echo "upstream_ref=${{ inputs.upstream_ref }}"
            echo "upstream_commit=${UPSTREAM_COMMIT}"
            echo "nikki_feed=nikkinikki-org/OpenWrt-nikki@main"
            echo "build_date=${BUILD_DATE}"
          } > "${OUT}/BUILD-INFO.txt"

          ls -lh "${OUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XR1710G-Nikki-${{ env.BUILD_DATE }}-${{ env.UPSTREAM_SHORT }}
          path: firmware/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: XR1710G-Nikki-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: XR1710G Nikki | ${{ env.BUILD_DATE }} | ${{ env.UPSTREAM_SHORT }}
          make_latest: true
          body: |
            Custom XR1710G firmware based on YYH2913/openwrt.

            - Upstream ref: `${{ inputs.upstream_ref }}`
            - Upstream commit: `${{ env.UPSTREAM_COMMIT }}`
            - Target: `airoha/an7581`
            - Device: `gemtek_xr1710g-ubi`
            - Nikki: included
            - Mihomo provider: mihomo-meta
            - kmod-dummy: included
            - kmod-tun: included
          files: firmware/*
