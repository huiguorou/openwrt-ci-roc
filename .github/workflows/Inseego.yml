name: IPQ807X-LibWrt (Pure Wired NSS)

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

env:
  REPO_URL: https://github.com/laipeng668/openwrt-6.x.git
  REPO_BRANCH: main-nss

  CONFIG_FILE: configs/IPQ807X.config
  GENERAL_CONFIG_FILE: configs/General.config
  DIY_SCRIPT: scripts/Jacob-script.sh

  FIRMWARE_TAG: IPQ807X
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

    # =====================================================
    # 1. Runner 信息
    # =====================================================

    - name: Check Server Performance
      run: |
        echo "================ CPU ================"
        nproc
        lscpu || true

        echo
        echo "=============== Memory =============="
        free -h

        echo
        echo "=============== Disk ================="
        df -hT


    # =====================================================
    # 2. 初始化 Ubuntu
    # =====================================================

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -Eeuo pipefail

        sudo -E apt-get update

        sudo -E apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          jq \
          ccache \
          upx-ucl

        curl -fsSL ophub.org/ubuntu2404-make-openwrt-depends \
          -o /tmp/openwrt-depends

        sudo -E apt-get install -y $(cat /tmp/openwrt-depends)

        sudo timedatectl set-timezone "$TZ"

        # 8GB Swap
        sudo swapoff /swapfile 2>/dev/null || true
        sudo rm -f /swapfile

        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

        free -h


    # =====================================================
    # 3. Checkout CI Repository
    # =====================================================

    - name: Checkout CI Repository
      uses: actions/checkout@v4


    # =====================================================
    # 4. 拉取 main-nss 最新源码
    #
    # 每次 workflow 都拉取最新 upstream commit。
    # =====================================================

    - name: Clone Latest Upstream Source
      run: |
        set -Eeuo pipefail

        sudo rm -rf /mnt/openwrt
        sudo mkdir -p /mnt/openwrt
        sudo chown -R "$(id -u):$(id -g)" /mnt/openwrt

        echo "===> Clone latest upstream"
        echo "Repo   : $REPO_URL"
        echo "Branch : $REPO_BRANCH"

        git clone \
          --depth 1 \
          --branch "$REPO_BRANCH" \
          --single-branch \
          "$REPO_URL" \
          /mnt/openwrt

        cd /mnt/openwrt

        CURRENT_BRANCH="$(git branch --show-current)"
        CURRENT_HASH="$(git rev-parse HEAD)"

        if [ "$CURRENT_BRANCH" != "$REPO_BRANCH" ]; then
          echo "ERROR: Expected branch $REPO_BRANCH but got $CURRENT_BRANCH"
          exit 1
        fi

        echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"
        echo "SOURCE_HASH=$CURRENT_HASH" >> "$GITHUB_ENV"

        SOURCE_REPO="$(basename "$REPO_URL" .git)"
        echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"

        VERSION_INFO="$(git show -s \
          --date=short \
          --format='作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H')"

        echo "VERSION_INFO=$VERSION_INFO" >> "$GITHUB_ENV"

        echo
        echo "============ Upstream ============"
        git log -1 --oneline
        echo "=================================="


    # =====================================================
    # 5. Feed 配置
    # =====================================================

    - name: Configure Feeds
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"

        if ! grep -q '^src-git nikki ' feeds.conf.default; then
          echo \
            'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' \
            >> feeds.conf.default
        fi

        echo "===== feeds.conf.default ====="
        cat feeds.conf.default


    # =====================================================
    # 6. 应用 Jacob 自定义
    #
    # 不修改 kernel NSS patch queue。
    # =====================================================

    - name: Apply Jacob Customization
      run: |
        set -Eeuo pipefail

        chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT"

        cd "$OPENWRT_PATH"

        "$GITHUB_WORKSPACE/$DIY_SCRIPT"


    # =====================================================
    # 7. 更新并安装 feeds
    # =====================================================

    - name: Update And Install Feeds
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"

        ./scripts/feeds update -a
        ./scripts/feeds install -a


    # =====================================================
    # 8. 生成最终配置
    # =====================================================

    - name: Generate Build Configuration
      run: |
        set -Eeuo pipefail

        cd "$OPENWRT_PATH"

        cat \
          "$GITHUB_WORKSPACE/$CONFIG_FILE" \
          "$GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE" \
          > .config


        # -----------------------------------------------
        # 清理互斥代理组件
        # -----------------------------------------------

        sed -i \
          -e '/CONFIG_PACKAGE_.*passwall/d' \
          -e '/CONFIG_PACKAGE_.*openclash/d' \
          -e '/CONFIG_PACKAGE_.*xray/d' \
          -e '/CONFIG_PACKAGE_.*v2ray/d' \
          -e '/CONFIG_PACKAGE_.*sing-box/d' \
          -e '/CONFIG_PACKAGE_.*shadowsocks/d' \
          -e '/CONFIG_PACKAGE_yq/d' \
          -e '/CONFIG_PACKAGE_ruby=y/d' \
          -e '/CONFIG_PACKAGE_ruby-yaml=y/d' \
          .config || true


        # -----------------------------------------------
        # Helper
        # -----------------------------------------------

        set_config_y() {
          local symbol="$1"

          sed -i \
            -e "/^${symbol}=.*/d" \
            -e "/^# ${symbol} is not set/d" \
            .config

          echo "${symbol}=y" >> .config
        }


        # -----------------------------------------------
        # FG2000
        # -----------------------------------------------

        set_config_y \
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_inseego_fg2000


        # -----------------------------------------------
        # Nikki 强制依赖
        #
        # kmod-dummy 必须存在。
        # -----------------------------------------------

        set_config_y CONFIG_PACKAGE_kmod-inet-diag
        set_config_y CONFIG_PACKAGE_kmod-tun
        set_config_y CONFIG_PACKAGE_kmod-dummy
        set_config_y CONFIG_PACKAGE_libncurses


        # -----------------------------------------------
        # NSS 核心
        # -----------------------------------------------

        set_config_y CONFIG_PACKAGE_kmod-qca-nss-dp
        set_config_y CONFIG_PACKAGE_kmod-qca-nss-drv
        set_config_y CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe
        set_config_y CONFIG_PACKAGE_kmod-qca-nss-ecm


        # shortcut-fe 为可选组件
        if grep -Rqs \
          'KernelPackage/shortcut-fe\|Package/kmod-shortcut-fe' \
          package feeds 2>/dev/null; then

          set_config_y CONFIG_PACKAGE_kmod-shortcut-fe

        else

          echo "INFO: kmod-shortcut-fe not present upstream; skip."

        fi


        # -----------------------------------------------
        # 5G modem
        # -----------------------------------------------

        set_config_y CONFIG_PACKAGE_kmod-usb-net-qmi-wwan
        set_config_y CONFIG_PACKAGE_kmod-usb-net-cdc-mbim
        set_config_y CONFIG_PACKAGE_kmod-mhi-net
        set_config_y CONFIG_PACKAGE_kmod-mhi-pci-generic
        set_config_y CONFIG_PACKAGE_modemmanager
        set_config_y CONFIG_PACKAGE_luci-proto-modemmanager
        set_config_y CONFIG_PACKAGE_usbutils


        if find package feeds \
          -type d \
          -name 'luci-app-modemband' \
          -print -quit \
          | grep -q .; then

          set_config_y CONFIG_PACKAGE_luci-app-modemband

        fi


        # -----------------------------------------------
        # Nikki
        # -----------------------------------------------

        set_config_y CONFIG_PACKAGE_nikki
        set_config_y CONFIG_PACKAGE_luci-app-nikki


        # -----------------------------------------------
        # 解析 Kconfig
        # -----------------------------------------------

        make defconfig

        echo
        echo "========== Target =========="

        grep '^CONFIG_TARGET_BOARD=' .config || true
        grep '^CONFIG_TARGET_SUBTARGET=' .config || true
        grep \
          'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_inseego_fg2000=y' \
          .config || true


    # =====================================================
    # 9. 检查关键依赖
    #
    # kmod-dummy / kmod-tun / Nikki / NSS 均为强制。
    # =====================================================

    - name: Validate Critical Configuration
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"

        require_config() {
          local symbol="$1"

          if ! grep -q "^${symbol}=y$" .config; then

            echo
            echo "=============================================="
            echo "ERROR: Required configuration is unavailable:"
            echo
            echo "  $symbol"
            echo
            echo "Upstream may have renamed or removed it."
            echo "=============================================="

            exit 1
          fi
        }


        require_config \
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_inseego_fg2000

        require_config \
          CONFIG_PACKAGE_kmod-qca-nss-dp

        require_config \
          CONFIG_PACKAGE_kmod-qca-nss-drv

        require_config \
          CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe

        require_config \
          CONFIG_PACKAGE_kmod-qca-nss-ecm

        require_config \
          CONFIG_PACKAGE_kmod-dummy

        require_config \
          CONFIG_PACKAGE_kmod-tun

        require_config \
          CONFIG_PACKAGE_nikki

        require_config \
          CONFIG_PACKAGE_luci-app-nikki


        DEVICE_TARGET="$(
          sed -n \
            's/^CONFIG_TARGET_BOARD="\([^"]*\)"/\1/p' \
            .config
        )"

        DEVICE_SUBTARGET="$(
          sed -n \
            's/^CONFIG_TARGET_SUBTARGET="\([^"]*\)"/\1/p' \
            .config
        )"

        echo "DEVICE_TARGET=$DEVICE_TARGET" >> "$GITHUB_ENV"
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> "$GITHUB_ENV"

        echo
        echo "Target    : $DEVICE_TARGET"
        echo "Subtarget : $DEVICE_SUBTARGET"

        echo
        echo "Critical Nikki/NSS dependencies:"
        grep \
          -E \
          'CONFIG_PACKAGE_(kmod-dummy|kmod-tun|nikki|luci-app-nikki|kmod-qca-nss)' \
          .config \
          || true


    # =====================================================
    # 10. 检测 Kernel Version
    # =====================================================

    - name: Detect Kernel Version
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"

        VERSION_KERNEL=""

        if [ -f target/linux/generic/kernel-6.12 ]; then

          VERSION_KERNEL="$(
            grep -oE \
              '[0-9]+\.[0-9]+\.[0-9]+' \
              target/linux/generic/kernel-6.12 \
              | head -n1 \
              || true
          )"

        fi

        if [ -z "$VERSION_KERNEL" ]; then
          VERSION_KERNEL="6.12.x"
        fi

        echo "VERSION_KERNEL=$VERSION_KERNEL" >> "$GITHUB_ENV"
        echo "Kernel: $VERSION_KERNEL"


    # =====================================================
    # 11. Cache
    #
    # 不缓存 staging_dir。
    # 避免上游更新之后 ABI/toolchain/header 污染。
    # =====================================================

    - name: Cache Downloads And Ccache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.OPENWRT_PATH }}/dl
          ${{ env.OPENWRT_PATH }}/.ccache

        key: libwrt-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.SOURCE_HASH }}

        restore-keys: |
          libwrt-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-
          libwrt-${{ env.REPO_BRANCH }}-


    # =====================================================
    # 12. 下载源码
    # =====================================================

    - name: Download Packages
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"

        make download -j"$(nproc)"

        # 删除异常下载文件
        find dl \
          -type f \
          -size -1024c \
          -print \
          -delete || true


    # =====================================================
    # 13. Kernel patch preflight
    #
    # 如果上游 patch queue 真有问题，在这里提前失败。
    # =====================================================

    - name: Kernel Patch Preflight
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"

        echo
        echo "==============================================="
        echo "Checking upstream kernel patch queue..."
        echo "==============================================="

        make target/linux/clean

        make target/linux/prepare -j1 V=s

        echo
        echo "Kernel patch queue successfully prepared."


    # =====================================================
    # 14. 编译
    # =====================================================

    - name: Compile Firmware
      id: compile
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"

        echo
        echo "========================================"
        echo "$(nproc) thread compile"
        echo "========================================"

        if ! make -j"$(nproc)"; then

          echo
          echo "Parallel build failed."
          echo "Retrying verbose single-thread build..."
          echo

          make -j1 V=s

        fi

        echo "status=success" >> "$GITHUB_OUTPUT"

        echo \
          "DATE=$(date +'%Y-%m-%d %H:%M:%S')" \
          >> "$GITHUB_ENV"

        echo \
          "FILE_DATE=$(date +'%Y.%m.%d')" \
          >> "$GITHUB_ENV"


    # =====================================================
    # 15. 磁盘空间
    # =====================================================

    - name: Check Space Usage
      if: always()
      run: |
        df -hT


    # =====================================================
    # 16. 整理固件
    # =====================================================

    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        set -Eeuo pipefail

        TARGET_DIR="$(
          find "$OPENWRT_PATH/bin/targets" \
            -mindepth 2 \
            -maxdepth 2 \
            -type d \
            | head -n1
        )"

        if [ -z "$TARGET_DIR" ]; then

          echo "ERROR: target output directory not found."
          exit 1

        fi

        cd "$TARGET_DIR"

        cp \
          "$OPENWRT_PATH/.config" \
          IPQ807X.config

        if [ -f config.buildinfo ]; then
          mv \
            config.buildinfo \
            IPQ807X.config.buildinfo
        fi

        MANIFEST="$(
          find . \
            -maxdepth 1 \
            -type f \
            -name '*.manifest' \
            | head -n1
        )"

        if [ -n "$MANIFEST" ]; then
          cp "$MANIFEST" IPQ807X.manifest
        fi


        mkdir -p packages

        find "$OPENWRT_PATH/bin/packages/" \
          -type f \
          \( -name '*.apk' -o -name '*.ipk' \) \
          -exec cp {} packages/ \; \
          2>/dev/null || true

        tar -zcf \
          IPQ807X.Packages.tar.gz \
          packages

        rm -rf packages

        rm -f \
          feeds.buildinfo \
          version.buildinfo \
          sha256sums \
          profiles.json \
          2>/dev/null || true

        echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"


    # =====================================================
    # 17. 发布 Release
    # =====================================================

    - name: Upload Firmware To Release
      if: steps.compile.outputs.status == 'success'
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.DATE }} for Inseego FG2000
        allowUpdates: true
        replacesArtifacts: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **Custom OpenWrt Firmware for Inseego FG2000**

          ### 固件信息

          - Target: Qualcomm IPQ807x
          - Device: Inseego FG2000
          - NSS: Enabled
          - Proxy: Nikki
          - Nikki dummy interface: Enabled
          - Default IP: 192.168.20.1
          - Default password: none

          ### Build

          - Kernel: ${{ env.VERSION_KERNEL }}
          - Source branch: ${{ env.REPO_BRANCH }}
          - Source commit: ${{ env.SOURCE_HASH }}

          ${{ env.VERSION_INFO }}
